name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build release packages
        shell: bash
        run: |
          set -eu
          mkdir dist

          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64
          do
            os=${target%/*}
            arch=${target#*/}
            name="concurrent-counter_${GITHUB_REF_NAME}_${os}_${arch}"
            mkdir "dist/$name"

            if [ "$os" = windows ]; then
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -trimpath -ldflags="-s -w" \
                -o "dist/$name/concurrent-counter.exe" .
              (cd dist && zip -qr "$name.zip" "$name")
            else
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -trimpath -ldflags="-s -w" \
                -o "dist/$name/concurrent-counter" .
              tar -czf "dist/$name.tar.gz" -C dist "$name"
            fi
          done

          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/concurrent-counter_${GITHUB_REF_NAME}_darwin_arm64.tar.gz#Mac - Apple Silicon" \
            "dist/concurrent-counter_${GITHUB_REF_NAME}_darwin_amd64.tar.gz#Mac - Intel" \
            "dist/concurrent-counter_${GITHUB_REF_NAME}_windows_amd64.zip#Windows - Intel/AMD 64-bit" \
            "dist/concurrent-counter_${GITHUB_REF_NAME}_windows_arm64.zip#Windows - ARM 64-bit" \
            "dist/concurrent-counter_${GITHUB_REF_NAME}_linux_amd64.tar.gz#Linux - Intel/AMD 64-bit" \
            "dist/concurrent-counter_${GITHUB_REF_NAME}_linux_arm64.tar.gz#Linux - ARM 64-bit" \
            "dist/checksums.txt#SHA-256 checksums" \
            --verify-tag \
            --generate-notes \
            --notes "## Downloads by platform

          ### Mac
          - [Apple Silicon](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/concurrent-counter_${GITHUB_REF_NAME}_darwin_arm64.tar.gz)
          - [Intel](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/concurrent-counter_${GITHUB_REF_NAME}_darwin_amd64.tar.gz)

          ### Windows
          - [Intel/AMD 64-bit](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/concurrent-counter_${GITHUB_REF_NAME}_windows_amd64.zip)
          - [ARM 64-bit](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/concurrent-counter_${GITHUB_REF_NAME}_windows_arm64.zip)

          ### Linux
          - [Intel/AMD 64-bit](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/concurrent-counter_${GITHUB_REF_NAME}_linux_amd64.tar.gz)
          - [ARM 64-bit](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/concurrent-counter_${GITHUB_REF_NAME}_linux_arm64.tar.gz)

          [SHA-256 checksums](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/checksums.txt)" \
            --title "$GITHUB_REF_NAME"
