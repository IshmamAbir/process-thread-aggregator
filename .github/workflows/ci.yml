name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Format
        run: if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then echo "Code not formatted correctly" && exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -race ./...

      - name: Build
        run: go build -o concurrent-counter .

      - name: Docker image build and run
        run: |
          docker build -t concurrent-counter:test .
          docker run --rm concurrent-counter:test -m 1 -n 2 -run-for 1s
